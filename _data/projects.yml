- id: animais-fantasticos
  title_pt: Animais Fantasticos
  title_en: Animais Fantasticos
  tags: [html, css, js]
  github: https://github.com/ericthmoritsuka/animais-fantasticos
  site: https://ericthmoritsuka.github.io/animais-fantasticos/
  images:
    - src: /img/portfolio/animais-fantasticos.jpg
      alt: Screenshot Animais Fantásticos
  desc_pt: |
    <p>O projeto Animais Fantasticos foi elaborado dentro do curso de JavaScript Completo ES6 da Origamid.</p>
    <p>Nele foram utilizados <span class="cor-p5">HTML, CSS e JavaScript</span> para desenhar a página e para codificá-la.</p>
    <p>O JavaScript foi utilizado para ajustar o scroll mais suave para as seções, fazer aparecer texto de acordo com a imagem clicada, fazer o accordion para a seção de FAQ, fazer com que as seções apareçam suavemente conforme o scroll do usuário pela página e o menu drop-down. Além disso, o slide de fotos foi criado de forma separada e adicionado ao projeto, FETCH foi utilizado para acessar aos números dos animais e o valor da bitcoin, há um cálculo feito no horário de funcionamento da loja e o horário local da máquina para verificar se a loja está aberta ou não, uma tooltip para inserir informação extra sobre o mapa e um modal para login. Grande parte do projeto foi refatorado e transformado em classes para que os módulos possam ser utilizados em outros projetos.</p>
    <p>A página é <span class="cor-p7">responsiva</span>.</p>
  desc_en: |
    <p>The Animais Fantasticos project was elaborated within the Complete JavaScript ES6 course at Origamid.</p>
    <p><span class="cor-p5">HTML, CSS and JavaScript</span> were used to draw the pages and code them.</p>
    <p>JavaScript was used to adjust the softer scroll that led to sections, to make the text appear according to the chosen image, to make the accordion for the FAQ section, to make the sections appear with the user's scroll movement through the page and the drop-down menu. Besides, the photo slide was created separately and added to the project, FETCH was used to access the number of animals and the value of bitcoin, there is a calculus being performed in the opening hours to check if the company is open or not, a tooltip was added in the map to show additional information and there is a modal with a login window. The majority of the project was refactored and transformed into classes so the modules could be used in other projects.</p>
    <p>The page is <span class="cor-p7">responsive</span>.</p>

