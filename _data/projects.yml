- id: dogs
  title_pt: Dogs
  title_en: Dogs
  tags: [css, js, react]
  github: https://github.com/ericthmoritsuka/dogs
  site: https://ericthmoritsuka.github.io/dogs/
  images:
    - src: /img/portfolio/dogs1.jpg
      alt: Screenshot dogs home
    - src: /img/portfolio/dogs2.jpg
      alt: Screenshot dogs adicionando fotos
  desc_pt: |
    <p>O projeto Dogs foi elaborado dentro do curso de React da Origamid.</p>
    <p>Nele foram utilizados <span class="cor-p5">CSS, JavaScript e React</span> para codificar a aplicação.</p>
    <p>Na aplicação (que utiliza basicamente React) é possível adicionar usuários (utilizando uma API desenvolvida em outro curso), resetar senha, postar fotos, deletar fotos, comentar em fotos da rede social e checar estatísticas do usuário.</p>
    <p>A API que está sendo utilizada é hosteada pelo curso Origamid, dessa forma, os dados são deletados periodicamente. Portanto, se você estiver testando o site e for deslogado ou se suas fotos desaparecerem, esse é o motivo.</p>
    <p>As páginas são <span class="cor-p7">responsivas</span>.</p>
  desc_en: |
    <p>The Dogs project was elaborated within the React course at Origamid.</p>
    <p><span class="cor-p5">CSS, JavaScript and React</span> were used to code and create the application.</p>
    <p>In this application (that uses mainly React), it is possible to add users (using an API developed in another course), reset the password, post photos, delete photos, comment on photos throughout the platform and check user stats.</p>
    <p>The API that is being used is hosted by Origamid. So, the data is reset after a while. In this sense, if you are testing the application and you get logged off or your photos disappear, that is the reason.</p>
    <p>The pages are <span class="cor-p7">responsive</span>.</p>

