- id: appsJS
  title_pt: Elementos com JS
  title_en: Elements with JS
  tags: [js, html, css]
  github: https://github.com/ericthmoritsuka/AppsComJS
  site: https://ericthmoritsuka.github.io/AppsComJS/
  images:
    - src: /img/portfolio/appsJS.jpg
      alt: Screenshot Apps com JS
  desc_pt: |
    <p>O projeto Elementos com JavaScript foi elaborado dentro do curso de JavaScript da Origamid.</p>
    <p>Nele foram utilizados <span class="cor-p5">HTML e CSS, mas o foco foi utilizar o JavaScript para criar diferentes elementos.</span></p>
    <p>Os elementos criados são: 1 - Um criador de botões onde é possível copiar o código CSS gerado a partir do que foi criado; 2 - Um cronômetro que inicia, pausa e pode ser resetado; 3 - Um dado que gera valores aleatórios quando clicado; 4 - Um elemento que utiliza FETCH para buscar informações sobre o preço do BITCOIN em reais; 5 - Um elemento que utiliza FETCH para buscar um CEP informado e retorna dados sobre o CEP; 6 - Um elemento que utiliza FETCH para buscar piadas sobre o Chuck Norris que retorna uma piada diferente quando clicado o botão de Next Joke.</p>
    <p>A página é <span class="cor-p7">responsiva</span>.</p>
  desc_en: |
    <p>The Elements with JavaScript project was elaborated within the JavaScript Course at Origamid.</p>
    <p><span class="cor-p5">HTML and CSS were used,</span> but the main goal was to use <span class="cor-p5">JavaScript</span> in order to create different elements.</p>
    <p>Here is a list of the elements: 1 - a button generator in which it is possible to copy the CSS code generated from the choices made; 2 - a timer that starts, pauses, resets and stops; 3 - a die that generates random values when clicked; 4 - an element that uses FETCH to get information about the price of bitcoins in Reais (R$); 5 - an element that uses FETCH to get information on a provided CEP (address code); 6 - an element that uses FETCH to get Chuck Norris' jokes.</p>
    <p>The page is <span class="cor-p7">responsive</span>.</p>

