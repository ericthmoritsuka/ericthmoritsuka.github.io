- id: pokedex
  title_pt: Pokedex
  title_en: Pokedex
  tags: [html, css, js]
  github: https://github.com/ericthmoritsuka/pokedex
  site: https://ericthmoritsuka.github.io/pokedex/
  images:
    - src: /img/portfolio/pokedex.jpg
      alt: Screenshot Pokedex aberta mostrando o Pikachu
    - src: /img/portfolio/pokedex2.jpg
      alt: Screenshot Pokedex fechada
  desc_pt: |
    <p>O projeto Pokedex simula o aparelho "de verdade": o site carrega com a Pokédex fechada e, ao clicar, ela se abre revelando a lista com todos os 1025 Pokémons de um lado e as informações do Pokémon selecionado do outro (em telas de celular, as duas metades se empilham na vertical).</p>
    <p>Todos os dados vêm da <span class="cor-p5">PokéAPI</span>: descrição, status, golpes com nível, cadeia de evolução clicável, arte shiny e até o grito de cada Pokémon. Há busca por nome ou número e links diretos (por exemplo, <code>#25</code> abre direto no Pikachu).</p>
    <p>Nesse projeto foram utilizados <span class="cor-p5">HTML, CSS e JavaScript</span> (módulos ES, sem frameworks). A ideia e a implementação original são minhas; as melhorias recentes (integração com a PokéAPI, o visual de aparelho e as abas de informações) foram feitas com assistência de IA (Claude), com a co-autoria marcada nos commits do GitHub.</p>
    <p>A página é <span class="cor-p7">responsiva</span>.</p>
  desc_en: |
    <p>The Pokedex project simulates the real device: the site loads with the Pokédex closed and, once clicked, it flips open revealing the list with all 1025 Pokémon on one side and the selected Pokémon's information on the other (on phone screens, the two halves stack vertically).</p>
    <p>All the data comes from <span class="cor-p5">PokéAPI</span>: description, stats, moves with learn levels, a clickable evolution chain, shiny artwork and even each Pokémon's cry. You can search by name or number, and deep links work too (for instance, <code>#25</code> opens straight on Pikachu).</p>
    <p><span class="cor-p5">HTML, CSS and JavaScript</span> (ES modules, no frameworks) were used in this project. The idea and the original implementation are mine; the recent improvements (the PokéAPI integration, the device look and the info tabs) were made with AI assistance (Claude), with the co-authorship marked on the GitHub commits.</p>
    <p>The page is <span class="cor-p7">responsive</span>.</p>

- id: rpgTrapalhoes
  title_pt: "RPG: Os Trapalhões"
  title_en: "RPG: Os Trapalhões"
  tags: [html, css, js]
  github: https://github.com/ericthmoritsuka/trapalhoesIlhaDosDinossauros
  site: https://ericthmoritsuka.github.io/trapalhoesIlhaDosDinossauros/
  images:
    - src: /img/portfolio/osTrapalhoes.jpg
      alt: "Screenshot RPG: Os Trapalhões"
    - src: /img/portfolio/osTrapalhoes3.jpg
      alt: ""
    - src: /img/portfolio/osTrapalhoes1.jpg
      alt: ""
  desc_pt: |
    <p>O projeto RPG: As Aventuras dos Trapalhões - A ilha dos Dinossauros é uma releitura de uma revistinha de 1993 dos Trapalhões que continha uma historinha RPG do tipo aventura de texto.</p>
    <p>Nela, era possível passar pela história e enfrentar desafios, atacar inimigos, sofrer penalidades, ser derrotado, ser vitorioso e recomeçar o jogo quantas vezes fossem necessárias para chegar até o final da aventura!</p>
    <p>O objetivo era fazer uma versão virtual (não é a versão final ainda, ainda quero implementar mais coisas) para que o meu irmãozinho pudesse jogar.</p>
    <p>Assim, eu editei algumas coisas na história e troquei alguns termos para que ficasse mais fácil para ele entender e para que ele se interessasse pela história.</p>
    <p>Nesse projeto foram utilizados <span class="cor-p5">HTML, CSS e JavaScript</span> para desenhar as páginas e para codificá-las. O código é super simples, pois o foco era na história e recortar e colar as figuras e montar todas as ramificações da história foi trabalhoso.</p>
    <p>As páginas são <span class="cor-p7">responsivas</span>.</p>
  desc_en: |
    <p>The RPG: As Aventuras dos Trapalhões - A ilha dos Dinossauros project is a text adventure based on a 1993 Os Trapalhões magazine.</p>
    <p>It was possible to go through the story, face challenges, attack enemies, suffer penalties, be defeated, be victorious and restart the game as many times as necessary in order to get to the end of the adventure!</p>
    <p>The goal was to make an updated virtual version (it is still not a final version, I still want to implement more elements) so my little brother could play it (he didn't do it much though... as there is much reading involved...).</p>
    <p>So, I edited some things in the story and changed some terms used to make it easier to follow the story and to make him more interested in it.</p>
    <p><span class="cor-p5">HTML, CSS and JavaScript</span> were used to draw and code the pages. The code is super simple because the main focus was on the story. So, it is basically just a copy and paste of pictures and organizing them. However, it was a lot of work to place them in the correct order.</p>
    <p>The pages are <span class="cor-p7">responsive</span>.</p>

